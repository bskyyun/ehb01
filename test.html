<!DOCTYPE html>
<html>
<head>
    <title>카메라 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        video {
            border: 2px solid #333;
            border-radius: 8px;
            width: 400px;
            height: 400px;
            background-color: #000;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>카메라 테스트</h1>
    <video id="webcam" autoplay playsinline></video>
    <button onclick="startCamera()">카메라 시작</button>
    <button onclick="stopCamera()">카메라 중지</button>
    <div class="status" id="status">준비 중...</div>

    <script>
        let stream = null;

        async function startCamera() {
            try {
                // 카메라 권한 요청
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                document.getElementById('status').innerText = '✅ 카메라 작동 중...';
            } catch (error) {
                console.error("카메라 오류:", error);
                document.getElementById('status').innerText = '❌ 카메라 오류: ' + error.message;
                alert("카메라 권한을 허용해주세요!");
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('webcam').srcObject = null;
                document.getElementById('status').innerText = '⏹️ 카메라 중지됨';
            }
        }

        // 페이지 로드 시 자동으로 카메라 시작
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
