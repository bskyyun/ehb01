<!DOCTYPE html>

    <title>사물인식 버튼 클릭</title>
</head>
<body>
    <script type="text/javascript">
    const URL = "https://withgoogle.com";

let model, webcam, labelContainer, maxPredictions;

async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    // 1. 모델 로드
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    // 2. 웹캠 설정
    const flip = false; 
    webcam = new tmImage.Webcam(400, 400, flip); 
     try{
    await webcam.setup({ facingMode: "environment" });
    await webcam.play();
    window.requestAnimationFrame(loop);

   // document.getElementById("webcam-container").appendChild(webcam.canvas);
  } catch (error) {
        console.error("카메라를 시작할 수 없습니다:", error);
        alert("카메라 권한을 허용해주시거나 HTTPS 연결을 확인해주세요.");
    }
}

async function loop() {
    webcam.update(); // 웹캠 프레임 업데이트
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    // 3. 현재 프레임 분석
    const prediction = await model.predict(webcam.canvas);
    
    for (let i = 0; i < maxPredictions; i++) {
        const className = prediction[i].className;
        const probability = prediction[i].probability.toFixed(2);

        // 확률이 90% 이상일 때만 버튼 클릭 동작
        if (probability > 0.90) {
            if (className === "Paper") {
                document.getElementById('btn-1').click();
                console.log("종이 인식 -> 1번 버튼 클릭");
            } else if (className === "Metal") {
                document.getElementById('btn-2').click();
                console.log("고철 인식 -> 2번 버튼 클릭");
            } else if (className === "Plastic") {
                document.getElementById('btn-3').click();
                console.log("플라스틱 인식 -> 3번 버튼 클릭");
            }
        }
    }
}
</script>
